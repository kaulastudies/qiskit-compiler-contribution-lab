# TEMPORARY, fork only: runs the reviewer's mutation check. Not part of any PR.
name: Review mutation check

on:
  push:
    branches: [review/test-gaps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python review/qclab_mutation_check.py | tee mutation.md
      - if: always()
        run: cat mutation.md >> "$GITHUB_STEP_SUMMARY"
